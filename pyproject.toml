[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tixati-qbittorrent-migrator"
version = "0.1.0"
description = "Build qBittorrent BT_backup files from Tixati-exported torrent metadata"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Codex" }]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
tixati-to-qbittorrent = "tixati_qbittorrent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = ["-q"]
pythonpath = ["src"]

